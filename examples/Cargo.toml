[package]
name = "wifimanager-example"
version = "0.1.0"
authors = ["filipton <filipton12@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
esp-backtrace = { version = "0.20.0", features = [ "esp32s3", "panic-handler", "println" ] }
esp-hal = { version = "1.2.2", features = [ "esp32s3", "unstable" ] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
log = { version = "0.4.34" }
esp-radio = { version = "1.0.0-beta.1", features = [ "esp32s3", "coex", "esp-alloc" ] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "embassy", "esp-radio"] }
embassy-executor = { version = "0.10.0", features = [] }
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "dhcpv4", "medium-ethernet", "proto-ipv4"] }
embassy-time = { version = "0.5.1" }
esp-storage = { version = "0.10.0", features = ["esp32s3", "embedded-storage"] }
embedded-storage = "0.3.2"
esp-hal-wifimanager = { path = "../", default-features = false, features = ["esp32s3", "ap", "ota", "ble"] }
static_cell = { version = "2.1.1", features = ["nightly"] }
heapless = { version = "0.9.3", default-features = false }
esp-alloc = "0.11.0"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }

[build-dependencies]
dotenvy = "0.15.7"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
