[package]
name = "esp-hal-wifimanager"
version = "0.6.2"
edition = "2021"
license = "MIT"
description = "Wifi Manager for esp-hal (bt+wifi ap)"
repository = "https://github.com/filipton/esp-hal-wifimanager"


[package.metadata.docs.rs]
features = ["esp32c3", "ap", "ble", "ota"]
default-target = "riscv32imc-unknown-none-elf"
targets = ["riscv32imc-unknown-none-elf"]

[lib]

[dependencies]
esp-hal = { version = "1.2.2", default-features = false, features = ["unstable", "rt"] }
esp-rtos = { version = "0.4.0", default-features = false, features = ["embassy"] }
embassy-net = { version = "0.9.1", default-features = false, features = ["tcp", "dhcpv4", "dhcpv4-hostname", "medium-ethernet", "proto-ipv4"] }
esp-radio = { version = "1.0.0-beta.1", default-features = false, features = [ "unstable", "wifi" ] }
static_cell = { version = "2.1.1" }
log = "0.4.34"
embassy-time = { version = "0.5.1", default-features = false }
embassy-executor = { version = "0.10.0", default-features = false }
heapless = { version = "0.9.3", default-features = false, features = ["serde"] }
embassy-sync = { version = "0.8.0", default-features = false }
esp-storage = { version = "0.10.0", default-features = false, features = ["critical-section", "embedded-storage"] }
embedded-storage = "0.3.2"
edge-dhcp = { version = "0.8.0", optional = true, default-features = false, features = ["io"] }
edge-nal = { version = "0.7.0", optional = true, default-features = false }
edge-nal-embassy = { version = "0.9.0", optional = true, default-features = false, features = ["proto-ipv4", "medium-ethernet", "udp"] }
embassy-futures = "0.1.2"
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc", "raw_value"] }
embedded-io-async = "0.7.0"
portable-atomic = { version = "1.15.0", default-features = false }
trouble-host = { version = "0.7.0", optional = true }
esp-nvs = "0.6.2"
esp-hal-ota = { version = "0.7.2", optional = true, features = ["log"] }
include-minifier = "0.2.0"

[features]
# pick exactly one chip feature yourself
default = ["ap", "ble", "ota"]

esp32s2 = ["esp-hal/esp32s2","esp-radio/esp32s2","esp-rtos/esp32s2","esp-storage/esp32s2", "esp-hal-ota?/esp32s2"]
esp32s3 = ["esp-hal/esp32s3","esp-radio/esp32s3","esp-rtos/esp32s3","esp-storage/esp32s3", "esp-hal-ota?/esp32s3"]

esp32c2 = ["esp-hal/esp32c2","esp-radio/esp32c2","esp-rtos/esp32c2","esp-storage/esp32c2", "esp-hal-ota?/esp32c2"]
esp32c3 = ["esp-hal/esp32c3","esp-radio/esp32c3","esp-rtos/esp32c3","esp-storage/esp32c3", "esp-hal-ota?/esp32c3"]
esp32c5 = ["esp-hal/esp32c5","esp-radio/esp32c5","esp-rtos/esp32c5","esp-storage/esp32c5", "esp-hal-ota?/esp32c5"]
esp32c6 = ["esp-hal/esp32c6","esp-radio/esp32c6","esp-rtos/esp32c6","esp-storage/esp32c6", "esp-hal-ota?/esp32c6"]
esp32c61 = ["esp-hal/esp32c61","esp-radio/esp32c61","esp-rtos/esp32c61","esp-storage/esp32c61", "esp-hal-ota?/esp32c61"]

esp32 = ["esp-hal/esp32","esp-radio/esp32","esp-rtos/esp32","esp-storage/esp32", "esp-hal-ota?/esp32"]

esp32s31 = ["esp-hal/esp32s31","esp-radio/esp32s31","esp-rtos/esp32s31","esp-storage/esp32s31", "esp-hal-ota?/esp32s31"]

ap = ["dep:edge-dhcp", "dep:edge-nal", "dep:edge-nal-embassy", "embassy-net/udp"]
ble = ["dep:trouble-host", "esp-radio/ble", "esp-radio/coex"]
ota = ["dep:esp-hal-ota"]
env = []
custom_panel = []

[profile.dev]
opt-level = 2
