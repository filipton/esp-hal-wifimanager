[alias]
esp32s2 = "build --no-default-features --features=esp32s2,ap,ota --target=xtensa-esp32s2-none-elf"
esp32s3 = "build --no-default-features --features=esp32s3,ble,ap,ota --target=xtensa-esp32s3-none-elf"

esp32c2 = "build --no-default-features --features=esp32c2,ble,ap,ota --target=riscv32imc-unknown-none-elf"
esp32c3 = "build --no-default-features --features=esp32c3,ble,ap,ota --target=riscv32imc-unknown-none-elf"
esp32c6 = "build --no-default-features --features=esp32c6,ble,ap,ota --target=riscv32imac-unknown-none-elf"

esp32 = "build --no-default-features --features=esp32,ble,ap,ota --target=xtensa-esp32-none-elf"

[target.'cfg(target_arch = "riscv32")']
rustflags = [
  "-C", "force-frame-pointers",
]

[target.'cfg(target_arch = "xtensa")']
rustflags = [
  "-C", "link-arg=-nostartfiles",
]

[build]
# default target for esp32s3
target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["alloc", "core"]
